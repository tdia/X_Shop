version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: xshop-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xshop_db
    ports:
      - "3306:3306"
    volumes:
      - xshop-db-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: xshop-backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=xshop_db
      - DB_USER=root
      - DB_PASSWORD=root
    depends_on:
      - db

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5001/api}
    container_name: xshop-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  xshop-db-data:
